[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudstack-openapi-ngine"
dynamic = ["version"]
description = "Generate an OpenAPI 3.2 document from the Apache CloudStack listApis endpoint"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "René Moser", email = "mail@renemoser.net" }]
keywords = ["cloudstack", "openapi", "swagger", "api", "codegen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Querying a live CloudStack endpoint.
live = ["cs>=3.0.0"]

[project.scripts]
cloudstack-openapi = "cloudstack_openapi.cli:main"

[project.urls]
Homepage = "https://github.com/ngine-io/cloudstack-openapi"
Repository = "https://github.com/ngine-io/cloudstack-openapi"
Issues = "https://github.com/ngine-io/cloudstack-openapi/issues"
Changelog = "https://github.com/ngine-io/cloudstack-openapi/releases"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "src/cloudstack_openapi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudstack_openapi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cloudstack_openapi"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 127
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff specific
]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cs.*"]
ignore_missing_imports = true
