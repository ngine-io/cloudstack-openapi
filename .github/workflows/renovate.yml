name: Renovate

on:
  schedule:
    # Daily. Offset from the full hour: scheduled runs at :00 queue behind the
    # rest of GitHub and get delayed.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
      dryRun:
        description: Run without creating branches, PRs or issues
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A run can take minutes; never let two overlap on the same repository.
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          # A PAT (or GitHub App token), never GITHUB_TOKEN: pull requests opened
          # with GITHUB_TOKEN do not trigger the CI workflow, so Renovate's
          # updates would arrive untested.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Only this repository; the token may have access to more.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate[bot]@users.noreply.github.com>"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
